name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      build: true
      test: true
      vet: true
      fmt: true
      lint: true

  govulncheck:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:govulncheck
      cancel-in-progress: true
    needs: ci
    if: ${{ always() }}
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0

  go-ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:go-ci
      cancel-in-progress: true
    needs: ci
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      # Replaces the old own `coverage` job (go test -coverprofile, 60% gate).
      run-test: true
      run-vet: false
      test-args: -coverprofile=coverage.out
      coverage-path: coverage.out
      coverage-artifact-name: coverage
      coverage-threshold: 60
