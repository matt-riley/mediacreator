name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Queue release runs so a newer push cannot cancel an in-flight GoReleaser
  # publish before the Homebrew tap update lands.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  dispatch-goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please-dispatch.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      release-created: ${{ needs.release-please.outputs.release_created }}
      tag: ${{ needs.release-please.outputs.tag_name }}
      workflow: goreleaser.yml
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
