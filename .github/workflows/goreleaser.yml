name: GoReleaser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      environment: release
      tap-app-id: ${{ vars.APP_ID }}
      go-version-file: go.mod
      working-directory: .
      tap-owner: matt-riley
      tap-repo: homebrew-tools
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      private-key: ${{ secrets.PRIVATE_KEY }}
